<button
  [type]="type"
  [class]="buttonClasses"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  @if (loading) {
    <span class="la-btn__spinner"></span>
  }
  <span class="la-btn__content" [class.la-btn__content--hidden]="loading">
    <ng-content></ng-content>
  </span>
</button>
