apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnaloud-ingress
  namespace: learnaloud
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: learnaloud-backend
            port:
              number: 5000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: learnaloud-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learnaloud-frontend
            port:
              number: 80
